# SHA-pinned actions age silently: a commit SHA does not say that a newer version exists.
# Dependabot reads the version comment behind the pin and opens a PR with the new SHA.
# Security updates run separately through the repository switch and need no entry here.
#
# Merged automatically once the required checks are green for exactly that head, majors included
# (.github/workflows/dependabot-auto-merge.yml from the repokit template).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Waiting time before version updates; does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      # Patch and minor together in one PR; majors come one by one.
      small:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    ignore:
      # The pin belongs to the repokit template (tests/_kit/vorlage_actions.yml) and comes with
      # `repokit sync`; a bump here would differ from the template and never turn green.
      - dependency-name: "actions/create-github-app-token"

  - package-ecosystem: pip
    directory: /
    # Only pyproject.toml; the audit tool list has its own entry below.
    exclude-paths:
      - ".github/**"
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    ignore:
      # Pinned by commit on purpose: raise only after reading the upstream diff (it drives the
      # owner's real account). A green suite does not prove that the form automation still works.
      - dependency-name: "kleinanzeigen-bot"
    groups:
      small:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # The hashed tool list of the vulnerability gate (.github/workflows/audit.yml).
  - package-ecosystem: pip
    directory: /.github/audit
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      small:
        patterns: ["*"]
        update-types: ["patch", "minor"]
